<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ironclad Construction | Built From The Ground Up</title>
<meta name="description" content="Ironclad Construction builds custom homes, additions, and renovations from foundation to final walkthrough — honest craft, built to last." />
<link rel="canonical" href="https://ironclad.traviskenlocean1.workers.dev/" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Ironclad Construction | Built From The Ground Up" />
<meta property="og:description" content="Custom homes, additions, and renovations — foundation to final walkthrough." />
<meta property="og:image" content="/assets/img/hero-poster.jpg" />
<meta property="og:url" content="https://ironclad.traviskenlocean1.workers.dev/" />

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-512.png" />
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />

<!-- JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "GeneralContractor",
  "name": "Ironclad Construction",
  "logo": "https://ironclad.traviskenlocean1.workers.dev/assets/img/ironclad-logo.png",
  "url": "https://ironclad.traviskenlocean1.workers.dev/"
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --white: #ffffff;
    --black: #0a0a0a;
    --green: #1f4a36;
    --green-light: #2c6b4d;
    --nav-h: clamp(92px, 10vw, 124px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    background: var(--white);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--white);
  }

  /* ---------- Nav ---------- */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--nav-h);
    z-index: 100;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 clamp(20px, 4vw, 56px);
    background: linear-gradient(to bottom, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.32) 55%, rgba(0,0,0,0) 100%);
    pointer-events: none;
  }

  .nav__logo {
    grid-column: 2;
    height: clamp(58px, 7.2vw, 82px);
    width: auto;
    display: block;
    pointer-events: auto;
  }

  .nav__menu {
    grid-column: 3;
    justify-self: end;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    background: transparent;
    border: none;
    cursor: pointer;
    pointer-events: auto;
  }

  .nav__menu svg { width: 26px; height: 26px; display: block; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    height: 220vh;
    height: 220svh;
  }

  .hero__media {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    width: 100%;
  }

  .hero__video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hero__scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 38%, rgba(0,0,0,0) 60%),
      linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 22%);
  }

  .hero__content {
    position: absolute;
    left: clamp(24px, 6vw, 72px);
    bottom: clamp(64px, 12vh, 130px);
    right: clamp(24px, 6vw, 72px);
    max-width: 900px;
  }

  .hero__headline {
    font-family: 'Archivo Black', 'Inter', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    line-height: 0.98;
    letter-spacing: -0.01em;
    font-size: clamp(2.6rem, 7.2vw, 6.2rem);
    color: var(--white);
    text-shadow: 0 2px 24px rgba(0,0,0,0.25);
  }

  .hero__headline span {
    display: block;
    overflow: hidden;
  }

  .hero__headline span b {
    display: block;
    transform-origin: left bottom;
  }

  .hero__sub {
    margin-top: clamp(18px, 2.4vw, 26px);
    font-size: clamp(0.98rem, 1.3vw, 1.15rem);
    font-weight: 400;
    line-height: 1.55;
    color: rgba(255,255,255,0.88);
    max-width: 560px;
  }

  .hero__arrow {
    margin-top: clamp(28px, 4vw, 44px);
    width: 22px;
    height: 22px;
  }

  .hero__arrow svg {
    width: 100%;
    height: 100%;
    stroke: rgba(255,255,255,0.85);
  }

  /* ---------- Blank ---------- */
  .blank {
    background: var(--white);
    min-height: 150vh;
  }
</style>
</head>
<body>

<nav class="nav">
  <img class="nav__logo" src="/assets/img/ironclad-logo-nav-primary.png" alt="Ironclad Construction" />
  <button class="nav__menu" type="button" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6" style="stroke:#fff" />
      <line x1="3" y1="12" x2="21" y2="12" style="stroke:#fff" />
      <line x1="3" y1="18" x2="21" y2="18" style="stroke:#fff" />
    </svg>
  </button>
</nav>

<section class="hero">
  <div class="hero__media">
    <video
      class="hero__video"
      src="/assets/video/hero-construction.mp4"
      poster="/assets/img/hero-poster.jpg"
      autoplay
      muted
      loop
      playsinline
    ></video>
    <div class="hero__scrim"></div>

    <div class="hero__content">
      <h1 class="hero__headline">
        <span><b>Ground Up,</b></span>
        <span><b>Built Ironclad.</b></span>
      </h1>
      <p class="hero__sub">
        From foundation to final walkthrough — custom homes, additions, and renovations built by a crew that treats every job like it's their own name on the sign.
      </p>
      <div class="hero__arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v16M5 13l7 7 7-7" />
        </svg>
      </div>
    </div>
  </div>
</section>

<section class="blank" aria-hidden="true"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

  // Intro: headline lines, subtext and arrow settle in from an oversized,
  // faded-out state — mirrors the reference site's load-in treatment.
  const tl = gsap.timeline({ delay: 0.15 });

  tl.from('.hero__headline span b', {
      scale: 1.4,
      opacity: 0,
      yPercent: 30,
      duration: 1.3,
      ease: 'power3.out',
      stagger: 0.12,
      transformOrigin: 'left bottom'
    })
    .from('.hero__sub', { opacity: 0, y: 24, duration: 0.9, ease: 'power2.out' }, '-=0.7')
    .from('.hero__arrow', { opacity: 0, y: 16, duration: 0.7, ease: 'power2.out' }, '-=0.5');

  // Scroll-out: as the page scrolls, headline/subtext/arrow ride up and fade
  // while the pinned video stays put underneath — same mechanic as the reference.
  gsap.to('.hero__content', {
    yPercent: -60,
    opacity: 0,
    ease: 'none',
    scrollTrigger: {
      trigger: '.hero',
      start: 'top top',
      end: () => '+=' + window.innerHeight * 0.9,
      scrub: true,
      invalidateOnRefresh: true
    }
  });
</script>

</body>
</html>
